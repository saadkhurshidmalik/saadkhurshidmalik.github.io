<style>
    /* Fixed navbar with the dark background gradient */
    .top-navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        background: radial-gradient(circle at 50% -20%, #1e293b 0%, #0f172a 60%, #090d16 100%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #ffffff;
        font-size: 18px;
        font-weight: 600;
        text-decoration: none;
    }

    .menu-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        transition: background 0.3s ease;
    }

    .menu-btn:hover {
        background: rgba(255, 255, 255, 0.2);
    }

    /* Fullscreen Overlay Menu */
    .overlay-navigation {
        height: 0%;
        width: 100%;
        position: fixed;
        z-index: 2000;
        top: 0;
        left: 0;
        background-color: rgba(9, 13, 22, 0.98);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        overflow-y: hidden;
        transition: 0.4s ease-in-out;
    }

    .overlay-navigation-content {
        position: relative;
        top: 15%;
        width: 100%;
        text-align: center;
        margin-top: 30px;
    }

    .overlay-navigation a {
        padding: 12px;
        text-decoration: none;
        font-size: 28px;
        color: #94a3b8;
        display: block;
        transition: 0.3s;
        font-weight: 400;
    }

    .overlay-navigation a:hover,
    .overlay-navigation a:focus {
        color: #38bdf8;
    }

    .overlay-navigation .closebtn {
        position: absolute;
        top: 20px;
        right: 40px;
        font-size: 50px;
        cursor: pointer;
    }
</style>

<!-- Navbar Header -->
<header class="top-navbar">

</script>
