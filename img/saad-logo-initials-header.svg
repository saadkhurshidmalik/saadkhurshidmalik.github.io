<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark Background Container -->
  <rect width="512" height="512" rx="112" fill="#111318"/>
  
  <!-- Subtle Border Accent -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="16"/>
  
  <!-- Styled Monogram "SK" -->
  <text x="220" y="325" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="210" 
        fill="#FFFFFF" 
        letter-spacing="-8" 
        text-anchor="middle">SK</text>
        
  <!-- Accent Dot (Matches your navbar brand) -->
  <circle cx="360" cy="305" r="28" fill="#5B5FEF"/>
</svg>
